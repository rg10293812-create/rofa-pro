{% extends 'base.html' %}{% block content %}<div class="head"><h1>العروض التسويقية</h1>{% if current_user.role!='viewer' %}<a class="btn" href="{{url_for('offer_new')}}">إضافة عرض تسويقي</a>{% endif %}</div><table><tr><th>العرض</th><th>السعر</th><th>المشاهدات</th><th>الحالة</th></tr>{% for o in offers %}<tr><td>{{o.title}}</td><td>{{o.price|sar}}</td><td>{{o.views}}</td><td>{{'نشط' if o.active else 'مخفي'}}</td></tr>{% endfor %}</table>{% endblock %}
