{% extends 'base.html' %}{% block content %}<div class="head"><h1>إدارة الموظفين</h1><a class="btn" href="{{url_for('employee_new')}}">إضافة موظف</a></div><table><tr><th>الاسم</th><th>المستخدم</th><th>الجوال</th><th>الدور</th><th>النسبة الأساسية</th><th>الحالة</th></tr>{% for e in employees %}<tr><td>{{e.full_name}}</td><td>{{e.username}}</td><td>{{e.phone}}</td><td>{{roles.get(e.role,e.role)}}</td><td>{{e.base_rate}}%</td><td>{{'نشط' if e.active else 'موقوف'}}</td></tr>{% endfor %}</table>{% endblock %}
