{% extends 'base.html' %}{% block content %}<div class="head"><h1>العقارات</h1>{% if current_user.role!='viewer' %}<a class="btn" href="{{url_for('property_new')}}">إضافة عقار</a>{% endif %}</div><table><tr><th>العقار</th><th>الحي</th><th>السعر</th><th>الحالة</th><th>حصري</th></tr>{% for p in properties %}<tr><td>{{p.title}}</td><td>{{p.district}}</td><td>{{p.price|sar}}</td><td>{{p.status}}</td><td>{{'⭐' if p.exclusive else '-'}}</td></tr>{% endfor %}</table>{% endblock %}
