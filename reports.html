{% extends 'base.html' %}{% block content %}<h1>إنشاء صفقة خارجية</h1><form method="post" class="form wide"><input name="title" placeholder="اسم الصفقة" required><input name="project_name" placeholder="اسم المشروع"><input name="deal_value" type="number" step="0.01" placeholder="قيمة الصفقة"><input name="company_rate" type="number" step="0.01" placeholder="نسبة الشركة %"><input name="broker_name" placeholder="اسم الوسيط الخارجي"><input name="broker_phone" placeholder="جوال الوسيط"><input name="broker_rate" type="number" step="0.01" placeholder="نسبة الوسيط %"><select name="status"><option value="open">مفتوحة</option><option value="closed">مغلقة</option><option value="cancelled">ملغاة</option></select><textarea name="notes" placeholder="ملاحظات"></textarea><h3>توزيع نسب الموظفين</h3>{% for e in employees %}<label class="rowline"><span>{{e.full_name}} — النسبة الأساسية {{e.base_rate}}%</span><input name="emp_rate_{{e.id}}" type="number" step="0.01" placeholder="نسبة هذا الموظف %"></label>{% endfor %}<button>حفظ الصفقة</button></form>{% endblock %}
